# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["mainForNETFLY"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with: 
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node.js v20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: install nvm
        run: nvm install && nvm use
      - name: Install dependencies
        run: |
              if [ ! -d "node_modules" ]; then
                echo "misisng nodes! installing..."
              npm i
              else
                echo "Nodes exist! skipping installation..."
              fi
      - name: Build project
        run: npm run build
      - name: copy files
        run: mkdir -p ./dist && cp -r .tmp/build/* ./dist
      - name: Commit build changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update build files"
          branch: mainForNETFLYBUILT
          commit_options: '--no-verify --signoff'
          file_pattern: '.'
          create_branch: true
          repository: .
          commit_user_name: My GitHub Actions Bot # defaults to "github-actions[bot]"
          commit_user_email: my-github-actions-bot@example.org # defaults to "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: Author <actions@github.com> # defaults to "username <numeric_id+username@users.noreply.github.com>", where "numeric_id" and "username" belong to the author of the commit that triggered the run
          push_options: '--force'
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload build repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
